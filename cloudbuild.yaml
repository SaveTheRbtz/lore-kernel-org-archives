steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/lore-mirror/lore-mirror:$BUILD_ID
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/lore-mirror/lore-mirror:$BUILD_ID
substitutions:
  _REGION: us-central1
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
